name: Build

on:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            artifact: linux-x86_64
          - name: macOS Clang
            os: macos-latest
            artifact: macos
          - name: Windows MinGW
            os: windows-latest
            artifact: windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          cache: true

      - name: Install Qt and MinGW
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Verify MinGW toolchain
        if: runner.os == 'Windows'
        run: |
          g++ --version
          ninja --version

      - name: Configure Linux or macOS
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package
          -DBUILD_TESTING=ON

      - name: Configure Windows with MinGW
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Assemble distributable directory
        run: cmake --install build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionExample-${{ matrix.artifact }}
          path: package
          if-no-files-found: error
          retention-days: 14
